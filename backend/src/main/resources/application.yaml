spring:
  application:
    name: moeda-estudantil-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/moeda}
    username: ${DATABASE_USER:moeda}
    password: ${DATABASE_PASSWORD:moeda}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp:
        auth: false
        starttls.enable: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-tem-que-ter-256-bits-no-minimo-para-hs256-algoritm-exemplo-1234}
    expiration-minutes: ${JWT_EXPIRATION_MIN:1440}
  url:
    api-base: ${API_BASE_URL:http://localhost:8080}
  mail:
    enabled: ${MAIL_ENABLED:false}
  notifications:
    rabbit:
      enabled: ${NOTIFICATIONS_RABBIT_ENABLED:false}
      exchange: ${NOTIFICATIONS_RABBIT_EXCHANGE:moeda.notifications}
      queue: ${NOTIFICATIONS_RABBIT_QUEUE:moeda.notifications.email}
      routing-key: ${NOTIFICATIONS_RABBIT_ROUTING_KEY:email}
    emailjs:
      enabled: ${EMAILJS_ENABLED:false}
      api-url: ${EMAILJS_API_URL:https://api.emailjs.com/api/v1.0/email/send}
      service-id: ${EMAILJS_SERVICE_ID:}
      template-id: ${EMAILJS_TEMPLATE_ID:}
      template-aluno-id: ${EMAILJS_TEMPLATE_ALUNO_ID:}
      template-professor-id: ${EMAILJS_TEMPLATE_PROFESSOR_ID:}
      template-parceiro-id: ${EMAILJS_TEMPLATE_PARCEIRO_ID:}
      template-resgate-aluno-id: ${EMAILJS_TEMPLATE_RESGATE_ALUNO_ID:${EMAILJS_TEMPLATE_ALUNO_ID:}}
      template-resgate-parceiro-id: ${EMAILJS_TEMPLATE_RESGATE_PARCEIRO_ID:${EMAILJS_TEMPLATE_PARCEIRO_ID:}}
      public-key: ${EMAILJS_PUBLIC_KEY:}
      private-key: ${EMAILJS_PRIVATE_KEY:}
    zapsender:
      enabled: ${ZAPSENDER_ENABLED:false}
      api-url: ${ZAPSENDER_API_URL:}
      token: ${ZAPSENDER_TOKEN:}

server:
  port: ${PORT:8080}
  error:
    include-message: always
