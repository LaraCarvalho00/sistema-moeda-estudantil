services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moeda
      POSTGRES_PASSWORD: moeda
      POSTGRES_DB: moeda
    ports:
      - "5432:5432"
    volumes:
      - moeda_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moeda -d moeda"]
      interval: 4s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: moeda
      RABBITMQ_DEFAULT_PASS: moeda
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 4s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/moeda
      DATABASE_USER: moeda
      DATABASE_PASSWORD: moeda
      MAIL_ENABLED: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: moeda
      RABBITMQ_PASSWORD: moeda
      NOTIFICATIONS_RABBIT_ENABLED: "true"
      NOTIFICATIONS_RABBIT_EXCHANGE: moeda.notifications
      NOTIFICATIONS_RABBIT_QUEUE: moeda.notifications.email
      NOTIFICATIONS_RABBIT_ROUTING_KEY: email
      EMAILJS_ENABLED: "false"
      EMAILJS_SERVICE_ID: ""
      EMAILJS_TEMPLATE_ID: ""
      EMAILJS_TEMPLATE_ALUNO_ID: ""
      EMAILJS_TEMPLATE_PROFESSOR_ID: ""
      EMAILJS_TEMPLATE_PARCEIRO_ID: ""
      EMAILJS_TEMPLATE_RESGATE_ALUNO_ID: ""
      EMAILJS_TEMPLATE_RESGATE_PARCEIRO_ID: ""
      EMAILJS_PUBLIC_KEY: ""
      EMAILJS_PRIVATE_KEY: ""
      ZAPSENDER_ENABLED: "false"
      ZAPSENDER_API_URL: ""
      ZAPSENDER_TOKEN: ""
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  moeda_pg_data: {}
